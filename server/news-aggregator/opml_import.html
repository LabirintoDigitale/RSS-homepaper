<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Importa fonti da OPML o pagina web</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--text:#1d2125;--muted:#6b7280;--line:#dfe3e8;--accent:#0284c7;--accent-text:#fff;--ok:#15803d;--warn:#b45309;--err:#b91c1c;--chip:#e8edf3;}
  @media (prefers-color-scheme:dark){:root{--bg:#111315;--card:#1b1e21;--text:#e8eaed;--muted:#9aa3ad;--line:#2d3237;--accent:#38bdf8;--accent-text:#04202e;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--chip:#272c31;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:150px}
  header{padding:14px 16px 6px;max-width:900px;margin:0 auto}
  h1{font-size:20px;margin:0}
  .ver{font-size:11px;color:var(--muted);margin-top:2px}
  main{max-width:900px;margin:0 auto;padding:0 12px}
  section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
  label.fld{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
  input[type=text],input[type=password],input[type=search],select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row>.grow{flex:1;min-width:140px}
  button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer}
  button.primary{background:var(--accent);color:var(--accent-text);border-color:transparent;font-weight:600}
  button.link{border:none;background:none;color:var(--accent);padding:2px 4px;font-size:13px}
  button:disabled{opacity:.45;cursor:not-allowed}
  #msg{margin:10px 0;padding:10px 12px;border-radius:8px;font-size:14px;border:1px solid var(--line);background:var(--card)}
  #msg.err{border-color:var(--err);color:var(--err)} #msg.warn{border-color:var(--warn);color:var(--warn)} #msg.ok{border-color:var(--ok);color:var(--ok)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  #toolbar{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
  #toolbar .stat{font-size:12px;color:var(--muted);margin-top:6px}
  .group{margin:14px 0 4px}
  .ghead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 4px;font-weight:700;font-size:14px}
  .ghead .n{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
  .feed{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:6px 0;padding:10px 12px;content-visibility:auto;contain-intrinsic-size:auto 120px}
  .feed[hidden],.group[hidden]{display:none}
  .feed .head{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
  .feed .head input{margin-top:4px;width:18px;height:18px;flex-shrink:0}
  .feed.exists .head{cursor:default;opacity:.6}
  .info{display:flex;flex-direction:column;min-width:0}
  .title{font-weight:600;word-break:break-word}
  .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .badge{background:var(--chip);border-radius:999px;padding:1px 8px;font-size:11px}
  .badge.stale{color:var(--warn)} .badge.exists{color:var(--ok)}
  .preview{margin:8px 0 0 28px;font-size:13px}
  .pitem{display:flex;gap:8px;justify-content:space-between;padding:2px 0;border-top:1px dotted var(--line)}
  .pitem:first-of-type{border-top:none}
  .pitem .pt{min-width:0;word-break:break-word}
  .pitem .pt a{color:inherit;text-decoration:none}
  .pitem .pd{color:var(--muted);font-size:11px;white-space:nowrap;padding-top:2px}
  .muted{color:var(--muted)} .err-t{color:var(--err)}
  .spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:-1px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  #bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:10}
  #bar .inner{max-width:900px;margin:0 auto}
  #sum{font-size:13px;margin-bottom:6px} #sum.warn{color:var(--warn)} #sum.danger{color:var(--err)}
  #prog{height:6px;background:var(--chip);border-radius:6px;overflow:hidden;margin:6px 0}
  #prog>div{height:100%;width:0;background:var(--accent);transition:width .2s}
  ul.fails{margin:6px 0 0;padding-left:18px;font-size:12px;max-height:110px;overflow:auto}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1 id="h1"></h1>
  <div class="ver" id="ver"></div>
</header>
<main>
  <section id="setup">
    <div id="tokenRow" hidden>
      <label class="fld" id="lblToken" for="token"></label>
      <input type="password" id="token" autocomplete="off" spellcheck="false">
    </div>
    <label class="fld" id="lblOpml" for="opml"></label>
    <div class="row">
      <input type="text" id="opml" class="grow" inputmode="url" autocomplete="off" spellcheck="false">
      <button class="primary" id="load"></button>
    </div>
    <div class="hint"><button class="link" id="example"></button> <span id="hintText"></span></div>
  </section>

  <div id="msg" hidden></div>

  <div id="chooser" hidden>
    <div id="toolbar">
      <div class="row">
        <input type="search" id="q" class="grow">
        <select id="cat"></select>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="selVisible"></button>
        <button id="selNone"></button>
        <label class="row" style="gap:6px;font-size:13px"><input type="checkbox" id="hideExisting"> <span id="lblHide"></span></label>
      </div>
      <div class="stat" id="stat"></div>
    </div>
    <div id="list"></div>
  </div>
</main>

<div id="bar" hidden>
  <div class="inner">
    <div id="sum"></div>
    <div id="prog" hidden><div></div></div>
    <div class="row" id="barActions">
      <button class="primary grow" id="add"></button>
    </div>
    <div class="row" id="confirmRow" hidden>
      <button class="primary grow" id="confirmYes"></button>
      <button id="confirmNo"></button>
    </div>
    <ul class="fails" id="fails" hidden></ul>
  </div>
</div>

<script>
(function () {
'use strict';

var PAGE_VERSION = '1.1.0';
var PAGE_BUILD = '2026-11-19-01';
var EXAMPLE_URL = 'https://github.com/tuan3w/awesome-tech-rss/blob/main/feeds.opml';
var PREVIEW_CONCURRENCY = 3;
var PREVIEW_TIMEOUT_MS = 25000;
var STALE_DAYS = 180;
// Stima del peso e dei tempi (indicativa, per avvisare prima di esagerare):
var BYTES_PER_ARTICLE = 1200;      // misurato su news.json: ~1,2 KB ad articolo
var SECONDS_PER_ARTICLE = 2.5;     // download immagine + eventuale traduzione
var CRON_BATCH = 10, CRON_EVERY_MIN = 2; // come nel crontab attuale
var SOFT_SOURCES = 40, HARD_SOURCES = 80, SOFT_ARTICLES = 1500, HARD_ARTICLES = 3000;

// ───────────────────────── testi ─────────────────────────
var I18N = {
  it: {
    title: 'Importa fonti da OPML o da una pagina web', token: 'Token API (lo stesso di settings.php)',
    opml_lbl: 'Indirizzo di un file OPML o di una pagina con dei feed', load: 'Carica elenco', example: 'Prova con un esempio', hint: '— va bene un link GitHub "blob" a un OPML, oppure una pagina come https://rssly.io/feeds: cerco i feed anche nelle sue sottopagine.',
    loading_list: 'Leggo l\'elenco… (se è una pagina web controllo tutti gli indirizzi: può servire fino a un minuto)', loaded_page: '{0} feed trovati in {1} pagine ({2} indirizzi controllati, {3} non erano feed)', loaded_timeout: ' · tempo finito: alcuni indirizzi non sono stati controllati', loaded: '{0} feed trovati', loaded_conv: '{0} feed trovati (link GitHub convertito nel file raw)',
    loaded_extra: '{0} già presenti, {1} doppioni nel file uniti, {2} indirizzi non validi ignorati',
    search: 'Cerca per nome, sito o categoria…', all_cats: 'Tutte le categorie', uncat: 'Senza categoria',
    sel_visible: 'Seleziona visibili', sel_none: 'Deseleziona tutto', hide_existing: 'Nascondi già presenti',
    stat: 'Visibili {0} di {1} · selezionati {2}', group_sel: 'seleziona', group_unsel: 'deseleziona',
    exists: 'già presente', added_now: 'aggiunta ora', stale: 'fermo da {0} mesi',
    pv_wait: 'anteprima in attesa…', pv_queue: 'in coda…', pv_load: 'carico l\'anteprima…', pv_retry: 'Riprova',
    pv_count: '{0} articoli', pv_count_more: 'almeno {0} articoli', pv_last: 'ultimo: {0}',
    sum: 'Selezionate {0} · fonti dopo l\'aggiunta: {1} (ora {2}) · articoli stimati ~{3} · cache ~{4} MB · primo giro completo ~{5}',
    warn_soft: 'Sono parecchie. La card e il sensore di Home Assistant diventano pesanti con molti articoli: meglio aggiungerne meno alla volta.',
    warn_hard: 'Sono troppe: migliaia di articoli rallentano molto il telefono e Home Assistant, e il primo aggiornamento dura ore. Consiglio di ridurre la selezione.',
    add: 'Aggiungi {0} fonti', add_one: 'Aggiungi 1 fonte', add_none: 'Seleziona almeno una fonte',
    confirm_q: 'Aggiungere {0} fonti alla sincronizzazione?', yes_add: 'Sì, aggiungi', cancel: 'Annulla',
    adding: 'Aggiungo {0} di {1}…', done: 'Fatto: aggiunte {0} fonti su {1}.', done_one: 'Fatto: aggiunta 1 fonte su {0}.', done_ok_tail: ' Compariranno nella card dopo i prossimi giri del cron (può servire qualche minuto).',
    failed_hdr: 'Non aggiunte:', stopped: 'Interrotto: {0}',
    err_token_missing: 'Inserisci il token API.', err_url_missing: 'Inserisci l\'indirizzo del file OPML o della pagina.',
    err_token: 'Token non valido: controlla settings.php.', err_missing_file: 'Il server non ha trovato {0}: copia il file nella stessa cartella di sources_admin.php.',
    err_not_json: 'Risposta inattesa dal server (HTTP {0}).', err_net: 'Server non raggiungibile ({0}).',
    err_timeout: 'tempo scaduto', no_sources_warn: 'Non riesco a leggere le fonti attuali ({0}): non potrò aggiungere finché non si risolve.'
  },
  en: {
    title: 'Import sources from OPML or a web page', token: 'API token (same as settings.php)',
    opml_lbl: 'Address of an OPML file or of a page listing feeds', load: 'Load list', example: 'Try an example', hint: '— a GitHub "blob" link to an OPML is fine, or a page like https://rssly.io/feeds: I look for feeds in its subpages too.',
    loading_list: 'Reading the list… (for a web page I check every address: it can take up to a minute)', loaded_page: '{0} feeds found in {1} pages ({2} addresses checked, {3} were not feeds)', loaded_timeout: ' · out of time: some addresses were not checked', loaded: '{0} feeds found', loaded_conv: '{0} feeds found (GitHub link converted to the raw file)',
    loaded_extra: '{0} already present, {1} duplicates in the file merged, {2} invalid addresses ignored',
    search: 'Search by name, site or category…', all_cats: 'All categories', uncat: 'Uncategorized',
    sel_visible: 'Select visible', sel_none: 'Clear selection', hide_existing: 'Hide already added',
    stat: 'Showing {0} of {1} · selected {2}', group_sel: 'select', group_unsel: 'clear',
    exists: 'already added', added_now: 'just added', stale: 'inactive for {0} months',
    pv_wait: 'preview pending…', pv_queue: 'queued…', pv_load: 'loading preview…', pv_retry: 'Retry',
    pv_count: '{0} articles', pv_count_more: 'at least {0} articles', pv_last: 'latest: {0}',
    sum: 'Selected {0} · sources after adding: {1} (now {2}) · estimated articles ~{3} · cache ~{4} MB · first full cycle ~{5}',
    warn_soft: 'That is quite a lot. The card and the Home Assistant sensor get heavy with many articles: better add fewer at a time.',
    warn_hard: 'That is too many: thousands of articles slow down the phone and Home Assistant a lot, and the first refresh takes hours. I suggest reducing the selection.',
    add: 'Add {0} sources', add_one: 'Add 1 source', add_none: 'Select at least one source',
    confirm_q: 'Add {0} sources to the sync?', yes_add: 'Yes, add', cancel: 'Cancel',
    adding: 'Adding {0} of {1}…', done: 'Done: added {0} of {1} sources.', done_one: 'Done: added 1 source of {0}.', done_ok_tail: ' They will show up in the card after the next cron runs (it may take a few minutes).',
    failed_hdr: 'Not added:', stopped: 'Stopped: {0}',
    err_token_missing: 'Enter the API token.', err_url_missing: 'Enter the address of the OPML file or page.',
    err_token: 'Invalid token: check settings.php.', err_missing_file: 'The server could not find {0}: copy the file next to sources_admin.php.',
    err_not_json: 'Unexpected response from the server (HTTP {0}).', err_net: 'Server not reachable ({0}).',
    err_timeout: 'timed out', no_sources_warn: 'Cannot read the current sources ({0}): I cannot add until this is fixed.'
  }
};

var params = new URLSearchParams((location.hash || '').replace(/^#/, ''));
var lang = (params.get('lang') || navigator.language || 'en').slice(0, 2).toLowerCase();
if (!I18N[lang]) lang = 'en';
function t(key) {
  var s = (I18N[lang][key] !== undefined ? I18N[lang][key] : I18N.en[key]) || key;
  for (var i = 1; i < arguments.length; i++) s = s.split('{' + (i - 1) + '}').join(String(arguments[i]));
  return s;
}

// ───────────────────────── stato ─────────────────────────
var state = {
  token: '', opmlUrl: '', feeds: [], existing: null /* null = non letto */, existingError: '', avgItems: 20,
  selected: new Set(), previews: new Map(), names: {}, running: false, serverVer: '', confirming: false
};
var $ = function (id) { return document.getElementById(id); };
var els = {};
['h1','ver','tokenRow','lblToken','token','lblOpml','opml','load','example','hintText','msg','chooser','q','cat','selVisible','selNone','hideExisting','lblHide','stat','list','bar','sum','prog','add','confirmRow','confirmYes','confirmNo','fails','barActions'].forEach(function (k) { els[k] = $(k); });

function store(k, v) { try { if (v === undefined) return sessionStorage.getItem('opmlimp:' + k); sessionStorage.setItem('opmlimp:' + k, v); } catch (e) { return null; } return null; }

function showMsg(text, kind) { els.msg.textContent = text; els.msg.className = kind || ''; els.msg.hidden = !text; }
function fmtDate(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso || '').slice(0, 16);
  try { return new Intl.DateTimeFormat(lang, { day: 'numeric', month: 'short', year: 'numeric' }).format(d); } catch (e) { return d.toISOString().slice(0, 10); }
}
function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
function safeHttp(u) { return /^https?:\/\//i.test(String(u || '')) ? u : ''; }
function fmtDuration(min) {
  if (min < 60) return Math.max(1, Math.round(min)) + ' min';
  var h = Math.floor(min / 60), m = Math.round(min % 60);
  return h + ' h' + (m ? ' ' + m + ' min' : '');
}

// ───────────────────────── rete ─────────────────────────
function ApiError(msg, fatal) { var e = new Error(msg); e.api = true; e.fatal = !!fatal; return e; }

function request(path, init, timeoutMs) {
  var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, timeoutMs || 30000) : null;
  init = init || {};
  init.headers = Object.assign({ 'X-API-Token': state.token }, init.headers || {});
  if (ctrl) init.signal = ctrl.signal;
  return fetch(path, init).then(function (res) {
    return res.text().then(function (txt) {
      var data = null;
      try { data = JSON.parse(txt); } catch (e) { /* non JSON */ }
      if (res.status === 401) throw ApiError(t('err_token'), true);
      if (data === null) {
        if (res.status === 404) throw ApiError(t('err_missing_file', path.split('?')[0]), true);
        throw ApiError(t('err_not_json', res.status), true);
      }
      return data;
    });
  }, function (e) {
    if (e && e.name === 'AbortError') throw ApiError(t('err_timeout'), false);
    throw ApiError(t('err_net', (e && e.message) || 'network'), true);
  }).then(function (d) { if (timer) clearTimeout(timer); return d; }, function (e) { if (timer) clearTimeout(timer); throw e; });
}

function apiGet(path, query) {
  return request(path + '?' + new URLSearchParams(query).toString(), {}, query.action === 'preview' ? PREVIEW_TIMEOUT_MS : 120000)
    .then(function (d) { if (d.version) state.serverVer = 'opml_import.php v' + d.version + ' · ' + d.build; if (!d.ok) throw ApiError(d.error || 'errore', false); return d; });
}

function loadExisting() {
  return request('sources_admin.php', {}, 20000).then(function (d) {
    if (!d.ok) throw ApiError(d.error || 'errore', false);
    state.existing = d.sources || [];
    state.existingError = '';
    // media di articoli per fonte, dalle statistiche reali del tuo server
    var vals = [];
    Object.keys(d.stats || {}).forEach(function (k) { var n = d.stats[k] && d.stats[k].items_found; if (n > 0) vals.push(n); });
    state.avgItems = vals.length ? Math.min(60, Math.max(5, Math.round(vals.reduce(function (a, b) { return a + b; }, 0) / vals.length))) : 20;
  }).catch(function (e) {
    state.existing = null;
    state.existingError = e.message;
  });
}

// ───────────────────────── caricamento elenco ─────────────────────────
function loadList() {
  state.token = els.token.value.trim() || state.token;
  state.opmlUrl = els.opml.value.trim();
  if (!state.token) { els.tokenRow.hidden = false; showMsg(t('err_token_missing'), 'err'); return Promise.resolve(); }
  if (!state.opmlUrl) { showMsg(t('err_url_missing'), 'err'); return Promise.resolve(); }
  store('token', state.token); store('opml', state.opmlUrl);
  showMsg(t('loading_list'), '');
  els.load.disabled = true;
  return Promise.all([apiGet('opml_import.php', { action: 'list', url: state.opmlUrl }), loadExisting()]).then(function (r) {
    var d = r[0];
    state.feeds = d.feeds || [];
    state.selected = new Set();
    state.previews = new Map();
    state.feeds.forEach(function (f) { state.previews.set(f.id, { status: 'idle' }); });
    queue.length = 0;
    renderList(d);
    var extra = t('loaded_extra', state.feeds.filter(function (f) { return f.exists; }).length, d.duplicates_in_file || 0, d.skipped_invalid || 0);
    var head = d.mode === 'page'
      ? t('loaded_page', d.total, d.pages_scanned || 1, d.candidates_checked || 0, d.not_feeds || 0) + (d.timed_out ? t('loaded_timeout') : '')
      : (d.converted ? t('loaded_conv', d.total) : t('loaded', d.total));
    var warn = state.existing === null ? ' ⚠ ' + t('no_sources_warn', state.existingError) : '';
    showMsg(head + ' · ' + extra + warn, state.existing === null ? 'warn' : 'ok');
    els.chooser.hidden = false;
    els.bar.hidden = false;
    updateFooter();
    renderVer();
  }).catch(function (e) {
    showMsg(e.message, 'err');
    if (/token/i.test(e.message)) els.tokenRow.hidden = false;
  }).then(function () { els.load.disabled = false; });
}

// ───────────────────────── elenco e filtri ─────────────────────────
var rowsById = new Map();

function renderList(meta) {
  els.list.textContent = '';
  rowsById.clear();
  var groups = new Map();
  state.feeds.forEach(function (f) {
    var c = f.category || '';
    if (!groups.has(c)) groups.set(c, []);
    groups.get(c).push(f);
  });

  els.cat.textContent = '';
  var optAll = document.createElement('option'); optAll.value = '__all'; optAll.textContent = t('all_cats') + ' (' + state.feeds.length + ')';
  els.cat.appendChild(optAll);

  groups.forEach(function (list, cat) {
    var label = cat || t('uncat');
    var opt = document.createElement('option'); opt.value = 'c:' + cat; opt.textContent = label + ' (' + list.length + ')';
    els.cat.appendChild(opt);

    var g = document.createElement('div'); g.className = 'group'; g.dataset.cat = cat;
    var h = document.createElement('div'); h.className = 'ghead';
    var left = document.createElement('span'); left.textContent = label;
    var n = document.createElement('span'); n.className = 'n'; n.textContent = String(list.length);
    left.appendChild(n);
    var btn = document.createElement('button'); btn.className = 'link'; btn.textContent = t('group_sel'); btn.dataset.act = 'group';
    h.appendChild(left); h.appendChild(btn); g.appendChild(h);

    list.forEach(function (f) {
      var row = document.createElement('div'); row.className = 'feed' + (f.exists ? ' exists' : ''); row.dataset.id = String(f.id); row.dataset.cat = cat;
      row.dataset.search = (f.title + ' ' + hostOf(f.url) + ' ' + cat).toLowerCase();
      var lbl = document.createElement('label'); lbl.className = 'head';
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.disabled = !!f.exists; cb.dataset.id = String(f.id);
      var info = document.createElement('span'); info.className = 'info';
      var ti = document.createElement('span'); ti.className = 'title'; ti.textContent = f.title;
      var meta = document.createElement('span'); meta.className = 'meta';
      var host = document.createElement('span'); host.textContent = hostOf(f.url); meta.appendChild(host);
      if (f.exists) { var b = document.createElement('span'); b.className = 'badge exists'; b.textContent = t('exists'); meta.appendChild(b); }
      info.appendChild(ti); info.appendChild(meta); lbl.appendChild(cb); lbl.appendChild(info); row.appendChild(lbl);
      var pv = document.createElement('div'); pv.className = 'preview'; row.appendChild(pv);
      g.appendChild(row);
      rowsById.set(f.id, row);
      renderPreview(f.id);
      observe(row);
    });
    els.list.appendChild(g);
  });
  applyFilters();
}

function applyFilters() {
  var q = els.q.value.trim().toLowerCase();
  var cat = els.cat.value;
  var hide = els.hideExisting.checked;
  var visible = 0;
  var byId = new Map(state.feeds.map(function (f) { return [f.id, f]; }));
  rowsById.forEach(function (row, id) {
    var f = byId.get(id);
    var ok = (cat === '__all' || cat === 'c:' + row.dataset.cat) && (!q || row.dataset.search.indexOf(q) !== -1) && !(hide && f.exists);
    row.hidden = !ok;
    if (ok) visible++;
  });
  els.list.querySelectorAll('.group').forEach(function (g) {
    g.hidden = !g.querySelector('.feed:not([hidden])');
    var btn = g.querySelector('[data-act=group]');
    var vis = g.querySelectorAll('.feed:not([hidden]) input:not(:disabled)');
    var allSel = vis.length > 0 && Array.prototype.every.call(vis, function (c) { return c.checked; });
    btn.textContent = allSel ? t('group_unsel') : t('group_sel');
    btn.hidden = vis.length === 0;
  });
  els.stat.textContent = t('stat', visible, state.feeds.length, state.selected.size);
}

function setSelected(id, on) {
  var f = state.feeds[id];
  if (!f || f.exists) return;
  if (on) state.selected.add(id); else state.selected.delete(id);
  var row = rowsById.get(id);
  if (row) row.querySelector('input').checked = on;
}

// ───────────────────────── anteprime (caricamento a richiesta) ─────────────────────────
var queue = [];
var active = 0;
var io = null;

function observe(row) {
  if (typeof IntersectionObserver === 'undefined') { enqueue(Number(row.dataset.id)); return; } // senza osservatore: coda ordinata
  if (!io) {
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        var id = Number(en.target.dataset.id);
        var st = state.previews.get(id);
        if (!st) return;
        if (en.isIntersecting) enqueue(id);
        else if (st.status === 'queued') { // uscita dallo schermo prima di partire: annulla
          var i = queue.indexOf(id); if (i !== -1) queue.splice(i, 1);
          st.status = 'idle'; renderPreview(id);
        }
      });
    }, { rootMargin: '400px 0px' });
  }
  io.observe(row);
}

function enqueue(id) {
  var st = state.previews.get(id);
  if (!st || (st.status !== 'idle' && st.status !== 'error')) return;
  st.status = 'queued';
  queue.push(id);
  renderPreview(id);
  pump();
}

function pump() {
  while (active < PREVIEW_CONCURRENCY && queue.length) {
    var id = queue.pop(); // l'ultimo arrivato = ciò che si sta guardando adesso
    var f = state.feeds[id];
    var st = state.previews.get(id);
    if (!f || !st) continue;
    st.status = 'loading';
    renderPreview(id);
    active++;
    (function (id, f, st) {
      apiGet('opml_import.php', { action: 'preview', url: f.url }).then(function (d) {
        st.status = 'ok'; st.data = d;
      }, function (e) {
        st.status = 'error'; st.error = e.message;
      }).then(function () { active--; renderPreview(id); pump(); });
    })(id, f, st);
  }
}

function renderPreview(id) {
  var row = rowsById.get(id); if (!row) return;
  var box = row.querySelector('.preview');
  var st = state.previews.get(id) || { status: 'idle' };
  box.textContent = '';
  var mk = function (cls, txt) { var s = document.createElement('span'); s.className = cls; s.textContent = txt; return s; };
  var oldStale = row.querySelector('.badge.stale'); if (oldStale) oldStale.remove();

  if (st.status === 'idle') { box.appendChild(mk('muted', t('pv_wait'))); return; }
  if (st.status === 'queued') { box.appendChild(mk('muted', t('pv_queue'))); return; }
  if (st.status === 'loading') { var sp = mk('spin', ''); box.appendChild(sp); box.appendChild(mk('muted', t('pv_load'))); return; }
  if (st.status === 'error') {
    box.appendChild(mk('err-t', '✕ ' + st.error + ' '));
    var rb = document.createElement('button'); rb.className = 'link'; rb.textContent = t('pv_retry'); rb.dataset.act = 'retry'; rb.dataset.id = String(id);
    box.appendChild(rb); return;
  }
  var d = st.data, items = d.items || [];
  var newest = 0;
  items.forEach(function (it) { var ts = Date.parse(it.date); if (!isNaN(ts) && ts > newest) newest = ts; });
  var head = document.createElement('div'); head.className = 'muted'; head.style.fontSize = '12px';
  var cnt = d.items_found_partial ? t('pv_count_more', d.items_found) : t('pv_count', d.items_found);
  head.textContent = cnt + (newest ? ' · ' + t('pv_last', fmtDate(new Date(newest).toISOString())) : '');
  box.appendChild(head);
  items.forEach(function (it) {
    var r = document.createElement('div'); r.className = 'pitem';
    var pt = document.createElement('span'); pt.className = 'pt';
    var href = safeHttp(it.link);
    if (href) { var a = document.createElement('a'); a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = it.title; pt.appendChild(a); }
    else pt.textContent = it.title;
    var pd = document.createElement('span'); pd.className = 'pd'; pd.textContent = it.date ? fmtDate(it.date) : '';
    r.appendChild(pt); r.appendChild(pd); box.appendChild(r);
  });
  if (newest && (Date.now() - newest) / 86400000 > STALE_DAYS) {
    var months = Math.floor((Date.now() - newest) / (30 * 86400000));
    var b = document.createElement('span'); b.className = 'badge stale'; b.textContent = t('stale', months);
    row.querySelector('.meta').appendChild(b);
  }
}

// ───────────────────────── riepilogo e stima ─────────────────────────
function estimate() {
  var n = state.selected.size;
  var current = state.existing ? state.existing.length : 0;
  var total = current + n;
  var articles = total * state.avgItems;
  var mb = Math.round(articles * BYTES_PER_ARTICLE / 1e5) / 10; // 1 decimale
  var minutes = Math.ceil(articles / CRON_BATCH) * CRON_EVERY_MIN;
  var level = (total > HARD_SOURCES || articles > HARD_ARTICLES) ? 'danger' : ((total > SOFT_SOURCES || articles > SOFT_ARTICLES) ? 'warn' : '');
  return { n: n, current: current, total: total, articles: articles, mb: mb, minutes: minutes, level: level };
}

function updateFooter() {
  var e = estimate();
  els.stat.textContent = t('stat', els.list.querySelectorAll('.feed:not([hidden])').length, state.feeds.length, e.n);
  var txt = t('sum', e.n, e.total, e.current, e.articles, String(e.mb).replace('.', lang === 'it' ? ',' : '.'), fmtDuration(e.minutes));
  if (e.level === 'warn') txt += ' — ' + t('warn_soft');
  if (e.level === 'danger') txt += ' — ' + t('warn_hard');
  if (state.confirming) { els.sum.textContent = t('confirm_q', e.n); els.sum.className = e.level; }
  else { els.sum.textContent = e.n ? txt : ''; els.sum.className = e.level; }
  els.add.textContent = e.n === 0 ? t('add_none') : (e.n === 1 ? t('add_one') : t('add', e.n));
  els.add.disabled = e.n === 0 || state.existing === null || state.running;
  els.barActions.hidden = state.confirming || state.running;
  els.confirmRow.hidden = !state.confirming;
  els.confirmYes.textContent = t('yes_add');
  els.confirmNo.textContent = t('cancel');
}

// ───────────────────────── nomi unici e aggiunta ─────────────────────────
function cleanName(s) {
  s = String(s || '').replace(/\s+/g, ' ').trim();
  return s.length > 40 ? s.slice(0, 39).trim() + '…' : s;
}
function uniqueName(base, host, taken) {
  var cand = base || host || 'feed';
  if (!taken.has(cand.toLowerCase())) return cand;
  if (host) {
    cand = base + ' (' + host + ')';
    if (!taken.has(cand.toLowerCase())) return cand;
  }
  for (var i = 2; i < 1000; i++) {
    cand = base + ' ' + i;
    if (!taken.has(cand.toLowerCase())) return cand;
  }
  return base + ' ' + Date.now();
}

function startAdd() {
  var ids = Array.from(state.selected).sort(function (a, b) { return a - b; });
  if (!ids.length || state.running) return;
  state.running = true; state.confirming = false;
  els.fails.hidden = true; els.fails.textContent = '';
  els.prog.hidden = false; els.prog.firstChild.style.width = '0%';
  updateFooter();
  window.onbeforeunload = function () { return ''; };

  var taken = new Set((state.existing || []).map(function (s) { return String(s.name || '').toLowerCase(); }));
  var plan = ids.map(function (id) {
    var f = state.feeds[id];
    var name = uniqueName(cleanName(f.title), hostOf(f.url), taken);
    taken.add(name.toLowerCase());
    return { id: id, name: name, url: f.url };
  });

  var ok = 0, fails = [], stopped = '';
  var i = 0;
  function next() {
    if (i >= plan.length || stopped) return Promise.resolve();
    var p = plan[i];
    els.sum.className = '';
    els.sum.textContent = t('adding', i + 1, plan.length);
    els.prog.firstChild.style.width = Math.round(i / plan.length * 100) + '%';
    return request('sources_admin.php', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'add', source: { name: p.name, url: p.url, type: 'standard', color: '' } })
    }, 20000).then(function (d) {
      if (d.ok) { ok++; var f = state.feeds[p.id]; f.exists = true; f.added_now = true; state.selected.delete(p.id); }
      else fails.push({ name: p.name, why: d.error || 'errore' });
    }, function (e) {
      if (e.fatal) stopped = e.message; else fails.push({ name: p.name, why: e.message });
    }).then(function () { i++; return next(); });
  }

  return next().then(function () {
    window.onbeforeunload = null;
    state.running = false;
    els.prog.firstChild.style.width = '100%';
    return loadExisting();
  }).then(function () {
    // aggiorna le righe appena aggiunte
    state.feeds.forEach(function (f) {
      if (!f.added_now) return;
      var row = rowsById.get(f.id); if (!row) return;
      row.classList.add('exists');
      var cb = row.querySelector('input'); cb.checked = false; cb.disabled = true;
      var m = row.querySelector('.meta'); var old = m.querySelector('.badge.exists'); if (old) old.remove();
      var b = document.createElement('span'); b.className = 'badge exists'; b.textContent = t('added_now'); m.appendChild(b);
    });
    applyFilters();
    var line = (ok === 1 ? t('done_one', plan.length) : t('done', ok, plan.length)) + (ok ? t('done_ok_tail') : '');
    if (stopped) line += ' ' + t('stopped', stopped);
    updateFooter();
    els.sum.className = fails.length || stopped ? 'warn' : '';
    els.sum.textContent = line;
    if (fails.length) {
      els.fails.hidden = false;
      var h = document.createElement('li'); h.textContent = t('failed_hdr'); h.style.listStyle = 'none'; h.style.marginLeft = '-18px'; els.fails.appendChild(h);
      fails.forEach(function (f) { var li = document.createElement('li'); li.textContent = f.name + ' — ' + f.why; els.fails.appendChild(li); });
    }
    els.prog.hidden = true;
  });
}

// ───────────────────────── eventi ─────────────────────────
function renderVer() {
  els.ver.textContent = 'opml_import.html v' + PAGE_VERSION + ' · ' + PAGE_BUILD + (state.serverVer ? ' · ' + state.serverVer : '');
}

function init() {
  document.title = t('title');
  els.h1.textContent = t('title');
  els.lblToken.textContent = t('token');
  els.lblOpml.textContent = t('opml_lbl');
  els.load.textContent = t('load');
  els.example.textContent = t('example');
  els.hintText.textContent = t('hint');
  els.q.placeholder = t('search');
  els.selVisible.textContent = t('sel_visible');
  els.selNone.textContent = t('sel_none');
  els.lblHide.textContent = t('hide_existing');
  renderVer();

  var tok = params.get('token') || store('token') || '';
  var opml = params.get('opml') || store('opml') || '';
  state.token = tok;
  els.token.value = '';
  els.opml.value = opml;
  if (params.get('token') || params.get('opml')) {
    // il token non deve restare nell'indirizzo visibile né nella cronologia
    store('token', tok); if (opml) store('opml', opml);
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignora */ }
  }
  if (!tok) els.tokenRow.hidden = false;

  els.load.addEventListener('click', loadList);
  els.opml.addEventListener('keydown', function (e) { if (e.key === 'Enter') loadList(); });
  els.example.addEventListener('click', function () { els.opml.value = EXAMPLE_URL; });
  els.q.addEventListener('input', function () { applyFilters(); });
  els.cat.addEventListener('change', applyFilters);
  els.hideExisting.addEventListener('change', applyFilters);

  els.selVisible.addEventListener('click', function () {
    els.list.querySelectorAll('.feed:not([hidden]) input:not(:disabled)').forEach(function (c) { setSelected(Number(c.dataset.id), true); });
    applyFilters(); updateFooter();
  });
  els.selNone.addEventListener('click', function () {
    Array.from(state.selected).forEach(function (id) { setSelected(id, false); });
    applyFilters(); updateFooter();
  });

  els.list.addEventListener('change', function (e) {
    var c = e.target;
    if (c && c.matches && c.matches('input[type=checkbox]')) { setSelected(Number(c.dataset.id), c.checked); applyFilters(); updateFooter(); }
  });
  els.list.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    if (b.dataset.act === 'retry') { enqueue(Number(b.dataset.id)); return; }
    if (b.dataset.act === 'group') {
      var g = b.closest('.group');
      var boxes = Array.prototype.slice.call(g.querySelectorAll('.feed:not([hidden]) input:not(:disabled)'));
      var allSel = boxes.length && boxes.every(function (c) { return c.checked; });
      boxes.forEach(function (c) { setSelected(Number(c.dataset.id), !allSel); });
      applyFilters(); updateFooter();
    }
  });

  els.add.addEventListener('click', function () { if (state.selected.size) { state.confirming = true; updateFooter(); } });
  els.confirmNo.addEventListener('click', function () { state.confirming = false; updateFooter(); });
  els.confirmYes.addEventListener('click', startAdd);

  if (tok && opml) loadList();
}

init();
})();
</script>
